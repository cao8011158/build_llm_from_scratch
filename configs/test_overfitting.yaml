# =========================
# OVERFIT ONE BATCH CONFIG
# =========================

data:
  root: /content/drive/MyDrive/build_llm_from_scratch/data
  dataset_name: tinystories

  memmap:
    enabled: true
    dtype: uint16
    train_bin: /content/drive/MyDrive/build_llm_from_scratch/data/train.bin
    valid_bin: /content/drive/MyDrive/build_llm_from_scratch/data/val.bin

tokenizer:
  vocab_size: 10000
  model_type: bpe
  lowercase: false

  vocab_file: /content/drive/MyDrive/build_llm_from_scratch/tokenizers/tinystories_train/tinystories_train_v10000_vocab.json
  merges_file: /content/drive/MyDrive/build_llm_from_scratch/tokenizers/tinystories_train/tinystories_train_v10000_merges.json

model:
  vocab_size: 10000
  context_length: 256

  num_layers: 4
  num_heads: 16
  d_model: 512

  ffn_multiplier: 2.6667
  dropout: 0.0

  use_rope: true
  rope_theta: 10000.0

# =========================
# Optimizer — easier memorization
# =========================
optimizer:
  name: adamw

  lr: 1.0e-3
  weight_decay: 0.0

  betas: [0.9, 0.95]
  eps: 1.0e-8

# =========================
# LR schedule — constant LR
# =========================
lr_schedule:
  name: cosine

  max_lr: 1.0e-3
  min_lr: 1.0e-3

  warmup_iters: 0
  cosine_cycle_iters: 1000000000

training:
  seed: 1337

  device: cuda
  dtype: bf16

  compile: false

  batch_size: 256
  grad_accum_steps: 1

  max_iters: 3000

  grad_clip: 0.0

  eval_interval: 100
  eval_iters: 1

  log_interval: 10

  overfit_one_batch: true

logging:
  to_console: true

  wandb:
    enabled: true
    project: build_llm_from_scratch
    name: DEBUG_overfit_one_batch
    tags: ["debug", "overfit_one_batch"]

checkpoint:
  save_dir: /content/drive/MyDrive/build_llm_from_scratch/checkpoints/DEBUG_overfit_one_batch

  save_interval: 500

  write_latest: false
